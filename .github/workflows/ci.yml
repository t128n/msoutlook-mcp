name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=bun-windows-x64 --outfile dist/msoutlook-mcp.exe src/main.ts
      - uses: actions/upload-artifact@v4
        with:
          name: msoutlook-mcp-windows-x64
          path: dist/msoutlook-mcp.exe
          if-no-files-found: error
