name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build archives
        run: bash scripts/package-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/release-assets/* \
              --title "msoutlook-mcp $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/release-assets/* \
              --title "msoutlook-mcp $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
